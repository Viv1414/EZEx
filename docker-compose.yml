services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ezpt
      POSTGRES_PASSWORD: ezpt
      POSTGRES_DB: ezpt
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  db_data:
# frontend service gets added here once the Next.js app is scaffolded
